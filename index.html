<title>F12 Unlocker</title>
<style>
:root{--bg:#f4f4f2;--surface:#e9e9e6;--ink:#111;--muted:#6b6b6b;--accent:#1f4fd8;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1600px;margin:0 auto;padding:0 40px}
.hero{min-height:100vh;display:grid;grid-template-rows:auto 1fr;padding-top:24px;padding-bottom:40px}
header{display:flex;align-items:center;justify-content:space-between}
.key{display:inline-flex;align-items:center;height:40px;padding:0 16px;border:2px solid var(--ink);border-radius:var(--r);font-weight:700;letter-spacing:.02em}
.tag{font-size:15px;color:var(--muted)}
.stage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;align-content:center;gap:40px;padding-top:64px}
h1{grid-column:1/-1;font-weight:700;font-size:clamp(40px,11.2vw,200px);line-height:.95;letter-spacing:-.05em;margin-left:-.04em;white-space:nowrap}
h1 small{font-size:.4em;font-weight:700;letter-spacing:-.04em;margin:0 .08em}
.stage .pyr{grid-column:2;grid-row:2;justify-self:end;height:50vh;width:auto;max-width:100%}
.stage .row{grid-column:1;grid-row:2;align-self:end}
.row{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 32px;border:0;border-radius:var(--r);background:var(--accent);color:#fff;font:600 17px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;cursor:pointer;transition:background-color .15s ease,transform .12s cubic-bezier(.2,.8,.2,1)}
.btn:hover{background:#1a43b8}.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.meta{font-size:15px;color:var(--muted)}
.band{background:var(--accent);color:#fff;overflow:hidden;padding:24px 0}
.track{display:flex;align-items:center;width:max-content;animation:run 40s linear infinite}
.track span{font-weight:700;font-size:clamp(40px,6vw,88px);letter-spacing:-.03em;line-height:1;white-space:nowrap;padding:0 40px}
.track svg{width:56px;height:64px;flex:none}
@keyframes run{to{transform:translateX(-50%)}}
.sec{background:var(--surface);padding:120px 0}
.grid{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:64px;align-items:center}
.cap{width:100%;max-width:420px}
.cap .top{transition:transform .15s cubic-bezier(.2,.8,.2,1)}
.cap:hover .top{transform:translateY(10px)}
.inv{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.inv.h{margin-top:24px}
.slot{aspect-ratio:1;background:var(--bg);border-radius:var(--r);display:flex;align-items:center;justify-content:center;padding:14%}
.slot svg{width:100%;height:100%}
.slot.sel{outline:2px solid var(--ink);outline-offset:2px}
.end{background:#14140f;color:#e8e8e6;padding:120px 0 64px}
.end .big{font-weight:700;font-size:clamp(40px,9vw,160px);line-height:.95;letter-spacing:-.04em;margin-bottom:64px;overflow-wrap:anywhere}
.end .meta{color:#8d8d86}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .35s ease,transform .35s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
@media(max-width:860px){.wrap{padding:0 24px}.stage,.grid{grid-template-columns:1fr;gap:40px}h1{font-size:17vw;white-space:normal}.stage .pyr{grid-column:1;grid-row:auto;width:min(100%,360px);height:auto;aspect-ratio:324/372;justify-self:start}.stage .row{grid-column:1;grid-row:auto}.sec,.end{padding:64px 0}.btn{width:100%;justify-content:center}
.stage .row{grid-column:1;grid-row:2;align-self:end}.inv{gap:4px}.slot{border-radius:6px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

  const s=atob(B64),u=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u],{type:'application/java-archive'}));
  const a=document.createElement('a');a.href=url;a.download='F12_Unlocker.jar';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}));
